backend:
  name: github
  repo: TU_USUARIO/TU_REPOSITORIO
  branch: main
locale: es
media_folder: "assets/uploads"
public_folder: "/assets/uploads"
publish_mode: simple
site_url: "https://TU-DOMINIO.es"
display_url: "https://TU-DOMINIO.es"
logo_url: "/assets/logo.png"
collections:
  - name: "web"
    label: "Editar web"
    files:
      - name: "contenido"
        label: "Textos, servicios y contacto"
        file: "content/site.json"
        format: "json"
        fields:
          - label: "Portada y contacto"
            name: "settings"
            widget: "object"
            fields:
              - {label: "Frase superior", name: "eyebrow", widget: "string"}
              - {label: "Portada · línea 1", name: "hero_line1", widget: "string"}
              - {label: "Portada · línea 2", name: "hero_line2", widget: "string"}
              - {label: "Portada · línea 3", name: "hero_line3", widget: "string"}
              - {label: "Texto de portada", name: "hero_text", widget: "text"}
              - {label: "Título filosofía", name: "philosophy_title", widget: "string"}
              - {label: "Filosofía · párrafo 1", name: "philosophy_p1", widget: "text"}
              - {label: "Filosofía · párrafo 2", name: "philosophy_p2", widget: "text"}
              - {label: "Filosofía · párrafo 3", name: "philosophy_p3", widget: "text"}
              - {label: "Título MindFit Ciencia", name: "science_title", widget: "string"}
              - {label: "Texto MindFit Ciencia", name: "science_text", widget: "text"}
              - {label: "WhatsApp (con 34)", name: "whatsapp", widget: "string"}
              - {label: "Teléfono Víctor", name: "phone_victor", widget: "string"}
              - {label: "Teléfono Antonio", name: "phone_antonio", widget: "string"}
              - {label: "Email", name: "email", widget: "string"}
              - {label: "Instagram (sin @)", name: "instagram", widget: "string"}
          - label: "Servicios"
            name: "services"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - {label: "Nombre", name: "name", widget: "string"}
              - {label: "Descripción", name: "description", widget: "text"}
              - {label: "Etiqueta", name: "tag", widget: "string"}
              - label: "Color"
                name: "color"
                widget: "select"
                options: ["green", "purple", "yellow", "coral", "orange", "blue"]
          - label: "Artículos de MindFit Ciencia"
            name: "articles"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Slug (sin espacios)", name: "slug", widget: "string", hint: "Ej.: fuerza-y-salud-osea"}
              - {label: "Categoría", name: "category", widget: "string", default: "SALUD"}
              - {label: "Fecha", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
              - {label: "Tiempo de lectura", name: "read_time", widget: "string", default: "5 min"}
              - {label: "Título", name: "title", widget: "string"}
              - {label: "Subtítulo", name: "subtitle", widget: "text"}
              - {label: "Introducción", name: "intro", widget: "text"}
              - label: "Secciones"
                name: "sections"
                widget: "list"
                summary: "{{fields.heading}}"
                fields:
                  - {label: "Encabezado", name: "heading", widget: "string"}
                  - {label: "Texto", name: "text", widget: "text"}
              - label: "Ideas clave"
                name: "takeaways"
                widget: "list"
                field: {label: "Idea", name: "item", widget: "string"}
              - {label: "Referencia científica", name: "reference", widget: "text"}
              - {label: "DOI", name: "doi", widget: "string", required: false}
              - {label: "Destacado", name: "featured", widget: "boolean", default: false}
