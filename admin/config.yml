backend:
  name: turbo-github
  turbo_site_id: 459520a2-52c9-4eba-a5a9-c402f522e8be
  branch: main

locale: es
media_folder: "assets/uploads"
public_folder: "/mindfit-training-web/assets/uploads"
publish_mode: simple
site_url: "https://victor96-mindfit.github.io/mindfit-training-web/"
display_url: "https://victor96-mindfit.github.io/mindfit-training-web/"
logo_url: "/mindfit-training-web/assets/logo.png"

collections:
  - name: "web"
    label: "Editar web"
    files:
      - name: "contenido"
        label: "Textos, servicios, contacto y ciencia"
        file: "content/site.json"
        format: "json"
        fields:
          - label: "Portada y contacto"
            name: "settings"
            widget: "object"
            fields:
              - {label: "Texto superior", name: "eyebrow", widget: "string"}
              - {label: "Título línea 1", name: "hero_line1", widget: "string"}
              - {label: "Título línea 2", name: "hero_line2", widget: "string"}
              - {label: "Título línea 3", name: "hero_line3", widget: "string"}
              - {label: "Texto de portada", name: "hero_text", widget: "text"}
              - {label: "Título filosofía", name: "philosophy_title", widget: "string"}
              - {label: "Filosofía párrafo 1", name: "philosophy_p1", widget: "text"}
              - {label: "Filosofía párrafo 2", name: "philosophy_p2", widget: "text"}
              - {label: "Filosofía párrafo 3", name: "philosophy_p3", widget: "text"}
              - {label: "Título MindFit Ciencia", name: "science_title", widget: "string"}
              - {label: "Descripción MindFit Ciencia", name: "science_text", widget: "text"}
              - {label: "WhatsApp", name: "whatsapp", widget: "string"}
              - {label: "Teléfono Víctor", name: "phone_victor", widget: "string", required: false}
              - {label: "Teléfono Antonio", name: "phone_antonio", widget: "string", required: false}
              - {label: "Email", name: "email", widget: "string", required: false}
              - {label: "Instagram", name: "instagram", widget: "string", required: false}

          - label: "Servicios"
            name: "services"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - {label: "Nombre", name: "name", widget: "string"}
              - {label: "Descripción", name: "description", widget: "text"}
              - {label: "Etiqueta", name: "tag", widget: "string"}
              - label: "Color"
                name: "color"
                widget: "select"
                options: ["green", "purple", "yellow", "coral", "orange", "blue"]

          - label: "Artículos MindFit Ciencia"
            name: "articles"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Título", name: "title", widget: "string"}
              - {label: "Identificador URL", name: "slug", widget: "string", hint: "Sin espacios. Ej.: fuerza-y-salud"}
              - {label: "Categoría", name: "category", widget: "string"}
              - {label: "Fecha", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false}
              - {label: "Tiempo de lectura", name: "read_time", widget: "string", default: "5 min"}
              - {label: "Subtítulo", name: "subtitle", widget: "text"}
              - {label: "Introducción", name: "intro", widget: "markdown", required: false, minimal: false, buttons: ["bold", "italic", "link", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list"]}
              - label: "Contenido"
                name: "sections"
                widget: "list"
                summary: "{{fields.heading}}"
                fields:
                  - {label: "Título de sección", name: "heading", widget: "string"}
                  - {label: "Texto", name: "text", widget: "markdown", minimal: false, buttons: ["bold", "italic", "link", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list"], hint: "Editor con formato: negrita, cursiva, títulos, enlaces, citas, listas con puntos y listas numeradas. Al pegar texto, revisa la vista previa antes de publicar."}
              - label: "Ideas clave"
                name: "takeaways"
                widget: "list"
                field: {label: "Idea", name: "item", widget: "string"}
              - {label: "Referencia científica", name: "reference", widget: "markdown", minimal: true, buttons: ["bold", "italic", "link"]}
              - {label: "DOI", name: "doi", widget: "string", required: false}
              - {label: "Enlace al estudio", name: "source_url", widget: "string", required: false}
              - {label: "Vídeo resumen del artículo (opcional)", name: "video_url", widget: "string", required: false, hint: "Pega aquí el enlace del vídeo (YouTube, YouTube Shorts o Vimeo). Si lo dejas vacío, no aparecerá nada en el artículo."}
              - {label: "Destacado", name: "featured", widget: "boolean", default: false, required: false}
