<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MindFit Training | Entrenamiento con sentido</title>
<meta name="description" content="MindFit Training: entrenamiento funcional, fuerza, salud, infancia y entrenamiento individualizado.">
<style>
:root{--ink:#121212;--paper:#f5f3ee;--green:#397f47;--line:#d9d5ca;--muted:#686762}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}.wrap{width:min(1180px,calc(100% - 40px));margin:auto}nav{position:sticky;top:0;z-index:10;background:rgba(245,243,238,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}nav .wrap{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.06em}.brand img{width:44px;height:44px;border-radius:50%}.links{display:flex;gap:24px}.links a,a{color:inherit;text-decoration:none}.hero{padding:105px 0 85px}.eyebrow,.tag{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--green)}h1{font-size:clamp(58px,10vw,132px);line-height:.82;letter-spacing:-.065em;margin:28px 0}.lead{max-width:720px;font-size:22px;line-height:1.55;color:#3f3f3c}.cta{display:inline-block;margin-top:24px;background:var(--ink);color:white;padding:16px 22px;border-radius:999px;font-weight:700}.section{padding:90px 0;border-top:1px solid var(--line)}h2{font-size:clamp(40px,6vw,72px);letter-spacing:-.05em;margin:0 0 34px}.copy{max-width:820px;font-size:20px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{border:1px solid var(--line);border-radius:22px;padding:28px;min-height:250px;background:#fff7}.card h3{font-size:28px;margin:14px 0}.card p{line-height:1.6;color:#454541}.science{background:#dfead9}.articles{display:grid;gap:14px}.article{display:block;border-top:1px solid #9eb098;padding:24px 0}.article strong{display:block;font-size:26px;margin:8px 0}.contact{display:grid;grid-template-columns:1.3fr 1fr;gap:50px}.contact a{display:block;font-size:20px;margin:14px 0;font-weight:700}.wa{position:fixed;right:22px;bottom:22px;background:#25D366;color:#fff;border-radius:999px;padding:16px 20px;font-weight:800;box-shadow:0 10px 30px #0002}footer{padding:35px 0;border-top:1px solid var(--line);color:var(--muted)}@media(max-width:760px){.links{display:none}.hero{padding-top:70px}.grid,.contact{grid-template-columns:1fr}.section{padding:65px 0}}
</style>
</head><body>
<nav><div class="wrap"><a class="brand" href="#inicio"><img src="assets/logo.png" alt="MindFit Training"><span>MINDFIT TRAINING</span></a><div class="links"><a href="#filosofia">Filosofía</a><a href="#servicios">Servicios</a><a href="#ciencia">Ciencia</a><a href="#contacto">Contacto</a></div></div></nav>
<main id="app"><section class="hero"><div class="wrap"><div class="eyebrow">MINDFIT TRAINING</div><h1>ENTRENA.<br>MUÉVETE.<br>VIVE MEJOR.</h1><p class="lead">Cargando contenido…</p></div></section></main>
<script>
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('content/site.json').then(r=>{if(!r.ok)throw Error('content');return r.json()}).then(d=>{const s=d.settings||{};const services=(d.services||[]).map(x=>`<article class="card"><div class="tag">${esc(x.tag)}</div><h3>${esc(x.name)}</h3><p>${esc(x.description)}</p></article>`).join('');const articles=(d.articles||[]).map(a=>`<a class="article" href="article.html?id=${encodeURIComponent(a.slug)}"><span class="tag">${esc(a.category)} · ${esc(a.read_time)}</span><strong>${esc(a.title)}</strong><span>${esc(a.subtitle)} →</span></a>`).join('');const wa=String(s.whatsapp||'').replace(/\D/g,'');document.getElementById('app').innerHTML=`<section class="hero" id="inicio"><div class="wrap"><div class="eyebrow">${esc(s.eyebrow)}</div><h1>${esc(s.hero_line1)}<br>${esc(s.hero_line2)}<br>${esc(s.hero_line3)}</h1><p class="lead">${esc(s.hero_text)}</p><a class="cta" href="#contacto">Quiero información</a></div></section><section class="section" id="filosofia"><div class="wrap"><h2>${esc(s.philosophy_title)}</h2><div class="copy"><p>${esc(s.philosophy_p1)}</p><p>${esc(s.philosophy_p2)}</p><p>${esc(s.philosophy_p3)}</p></div></div></section><section class="section" id="servicios"><div class="wrap"><div class="eyebrow">PROGRAMAS</div><h2>ENTRENA A TU MANERA</h2><div class="grid">${services}</div></div></section><section class="section science" id="ciencia"><div class="wrap"><div class="eyebrow">DIVULGACIÓN</div><h2>${esc(s.science_title)}</h2><p class="copy">${esc(s.science_text)}</p><div class="articles">${articles}</div></div></section><section class="section" id="contacto"><div class="wrap contact"><div><div class="eyebrow">CONTACTO</div><h2>EMPEZAMOS POR TI.</h2><p class="copy">Cuéntanos qué necesitas y te orientamos sobre la opción de entrenamiento más adecuada.</p></div><div>${wa?`<a href="https://wa.me/${wa}" target="_blank" rel="noopener">WhatsApp →</a>`:''}${s.phone_victor?`<a href="tel:${esc(s.phone_victor)}">Víctor · ${esc(s.phone_victor)}</a>`:''}${s.phone_antonio?`<a href="tel:${esc(s.phone_antonio)}">Antonio · ${esc(s.phone_antonio)}</a>`:''}${s.email?`<a href="mailto:${esc(s.email)}">${esc(s.email)}</a>`:''}${s.instagram?`<a href="https://instagram.com/${encodeURIComponent(s.instagram)}" target="_blank" rel="noopener">Instagram · @${esc(s.instagram)}</a>`:''}</div></div></section>${wa?`<a class="wa" href="https://wa.me/${wa}" target="_blank" rel="noopener">WhatsApp</a>`:''}<footer><div class="wrap">MindFit Training · Entrenamiento con sentido</div></footer>`}).catch(()=>{document.querySelector('.lead').textContent='No se ha podido cargar el contenido. Revisa content/site.json.'});
</script></body></html>
