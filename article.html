<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MindFit Ciencia</title><meta name="description" content="MindFit Ciencia: entrenamiento, salud y movimiento explicados de forma clara."><style>:root{--ink:#121212;--paper:#f5f3ee;--green:#397f47;--muted:#686762;--line:#d9d5ca}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}.wrap{width:min(900px,calc(100% - 40px));margin:auto}nav{border-bottom:1px solid var(--line)}nav .wrap{height:76px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.06em}.brand img{width:44px;height:44px;border-radius:50%}a{color:inherit;text-decoration:none}.hero{padding:90px 0 55px}.meta{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--green)}h1{font-size:clamp(44px,7vw,78px);line-height:.98;letter-spacing:-.05em;margin:20px 0}.subtitle,.intro{font-size:22px;line-height:1.55;color:#444}.intro{margin:0 0 45px}.article{padding:45px 0 100px;border-top:1px solid var(--line)}.section{margin:45px 0}.section>h2{font-size:32px;letter-spacing:-.03em}.rich{font-size:19px;line-height:1.75}.rich p{margin:0 0 1.25em}.rich h1{font-size:38px;line-height:1.08;letter-spacing:-.03em;margin:1.5em 0 .7em}.rich h2{font-size:32px;line-height:1.15;letter-spacing:-.03em;margin:2em 0 .7em}.rich h3{font-size:25px;line-height:1.25;margin:1.6em 0 .55em}.rich h4{font-size:21px;margin:1.4em 0 .5em}.rich strong{font-weight:800}.rich em{font-style:italic}.rich ul,.rich ol{padding-left:1.6em;margin:1em 0 1.5em}.rich li{margin:.45em 0;padding-left:.2em}.rich hr{border:0;border-top:1px solid var(--line);margin:2.4em 0}.rich blockquote{margin:1.8em 0;padding:2px 0 2px 22px;border-left:4px solid var(--green);color:#444}.rich a{text-decoration:underline;text-decoration-color:var(--green);text-underline-offset:3px}.take{margin:60px 0;padding:30px;border-radius:22px;background:#dfead9}.take li{margin:12px 0;line-height:1.55}.video{margin:60px 0}.video h2{font-size:30px;margin:10px 0 22px}.video-frame{width:100%;overflow:hidden;border-radius:22px;background:#111}.video-frame video{display:block;width:100%;height:auto;max-height:80vh;background:#111}.video-frame iframe{display:block;width:100%;aspect-ratio:16/9;border:0}.video-link{display:inline-block;margin-top:14px;text-decoration:underline;text-decoration-color:var(--green);text-underline-offset:3px}.ref{border-top:1px solid var(--line);padding-top:25px;line-height:1.6}.notice{color:var(--muted);font-size:14px;margin-top:28px}@media(max-width:650px){.hero{padding-top:60px}.rich{font-size:18px}.rich h1{font-size:31px}.rich h2{font-size:28px}.rich h3{font-size:23px}.video h2{font-size:26px}.video-frame{border-radius:14px}}</style></head><body><nav><div class="wrap"><a class="brand" href="index.html"><img src="assets/logo.png" alt="MindFit"><span>MINDFIT CIENCIA</span></a><a href="index.html#ciencia">← Volver</a></div></nav><main id="app"><div class="wrap hero"><div class="meta">CARGANDO…</div><h1>MindFit Ciencia</h1></div></main><script>const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));function inline(s){return esc(s).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/\*\*\*([^*]+)\*\*\*/g,'<strong><em>$1</em></strong>').replace(/\*\*\s*([\s\S]*?)\s*\*\*/g,'<strong>$1</strong>').replace(/__\s*([\s\S]*?)\s*__/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>').replace(/(^|[^_])_([^_\n]+)_/g,'$1<em>$2</em>')}function md(src){let lines=String(src??'').replace(/\r/g,'').split('\n'),out=[],para=[],list=null;const flush=()=>{if(para.length){out.push('<p>'+inline(para.join(' ').trim())+'</p>');para=[]}};const close=()=>{if(list){out.push('</'+list+'>');list=null}};for(const raw of lines){let l=raw.trim();if(!l){flush();close();continue}if(/^---+$/.test(l)){flush();close();out.push('<hr>');continue}let m=l.match(/^(#{1,4})\s+(.+)$/);if(m){flush();close();let n=m[1].length;out.push('<h'+n+'>'+inline(m[2])+'</h'+n+'>');continue}m=l.match(/^[-*+]\s+(.+)$/);if(m){flush();if(list!=='ul'){close();list='ul';out.push('<ul>')}out.push('<li>'+inline(m[1])+'</li>');continue}m=l.match(/^\d+[.)]\s+(.+)$/);if(m){flush();if(list!=='ol'){close();list='ol';out.push('<ol>')}out.push('<li>'+inline(m[1])+'</li>');continue}m=l.match(/^>\s?(.*)$/);if(m){flush();close();out.push('<blockquote>'+inline(m[1])+'</blockquote>');continue}close();para.push(l)}flush();close();return out.join('')}function videoBlock(value){if(!value)return'';let u=String(value).trim();const title='<div class="meta">VÍDEO RESUMEN</div><h2>El artículo, explicado en vídeo</h2>';if(/\.(mp4|webm|ogg|mov)(\?.*)?$/i.test(u)||u.includes('/assets/uploads/'))return`<section class="video">${title}<div class="video-frame"><video controls playsinline preload="metadata"><source src="${esc(u)}">Tu navegador no puede reproducir este vídeo.</video></div></section>`;let embed='';try{let x=new URL(u),host=x.hostname.replace(/^www\./,'');if(host==='youtu.be'){let id=x.pathname.split('/').filter(Boolean)[0];if(id)embed='https://www.youtube.com/embed/'+encodeURIComponent(id)}else if(host==='youtube.com'||host==='m.youtube.com'){let id=x.searchParams.get('v');if(!id&&x.pathname.startsWith('/shorts/'))id=x.pathname.split('/')[2];if(!id&&x.pathname.startsWith('/embed/'))id=x.pathname.split('/')[2];if(id)embed='https://www.youtube.com/embed/'+encodeURIComponent(id)}else if(host==='vimeo.com'||host==='player.vimeo.com'){let id=x.pathname.split('/').filter(Boolean).find(p=>/^\d+$/.test(p));if(id)embed='https://player.vimeo.com/video/'+id}}catch(e){}if(embed)return`<section class="video">${title}<div class="video-frame"><iframe src="${esc(embed)}" title="Vídeo resumen del artículo" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div></section>`;return`<section class="video">${title}<a class="video-link" href="${esc(u)}" target="_blank" rel="noopener">Ver vídeo resumen →</a></section>`}const id=new URLSearchParams(location.search).get('id');fetch('content/site.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{const a=(data.articles||[]).find(x=>x.slug===id)||(data.articles||[]).find(x=>x.featured)||(data.articles||[])[0];if(!a)throw Error();document.title=a.title+' | MindFit Ciencia';const sections=(a.sections||[]).map(x=>`<section class="section">${x.heading?`<h2>${inline(x.heading.replace(/\*+$/,'').trim())}</h2>`:''}<div class="rich">${md(x.text)}</div></section>`).join('');const points=(a.takeaways||[]).map(x=>`<li>${inline(typeof x==='string'?x:x.item)}</li>`).join('');document.getElementById('app').innerHTML=`<div class="wrap hero"><div class="meta">${esc(a.category)} · ${esc(a.date)} · ${esc(a.read_time)}</div><h1>${esc(a.title)}</h1><p class="subtitle">${esc(a.subtitle)}</p></div><article class="wrap article">${a.intro?`<div class="intro rich">${md(a.intro)}</div>`:''}${sections}${points?`<aside class="take"><div class="meta">IDEAS CLAVE</div><h2>Qué nos llevamos</h2><ul>${points}</ul></aside>`:''}${videoBlock(a.video_url)}<div class="ref"><div class="meta">REFERENCIA</div><div class="rich">${md(a.reference)}</div>${a.source_url?`<p><a href="${esc(a.source_url)}" target="_blank" rel="noopener">Consultar fuente →</a></p>`:''}${a.doi?`<p>DOI: ${esc(a.doi)}</p>`:''}<p class="notice">Contenido divulgativo. No sustituye una valoración individual por un profesional sanitario cuando sea necesaria.</p></div></article>`}).catch(()=>document.getElementById('app').innerHTML='<div class="wrap hero"><h1>No hemos encontrado este artículo.</h1><p><a href="index.html#ciencia">Volver a MindFit Ciencia</a></p></div>');</script></body></html>
