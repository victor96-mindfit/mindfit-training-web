<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MindFit Ciencia</title><meta name="description" content="MindFit Ciencia: entrenamiento, salud y movimiento explicados de forma clara."><style>:root{--ink:#121212;--paper:#f5f3ee;--green:#397f47;--muted:#686762;--line:#d9d5ca}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}.wrap{width:min(900px,calc(100% - 40px));margin:auto}nav{border-bottom:1px solid var(--line)}nav .wrap{height:76px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.06em}.brand img{width:44px;height:44px;border-radius:50%}a{color:inherit;text-decoration:none}.hero{padding:90px 0 55px}.meta{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--green)}h1{font-size:clamp(44px,7vw,78px);line-height:.98;letter-spacing:-.05em;margin:20px 0}.subtitle,.intro{font-size:22px;line-height:1.55;color:#444}.intro{margin:0 0 45px}.article{padding:45px 0 100px;border-top:1px solid var(--line)}.section{margin:45px 0}.section h2{font-size:32px;letter-spacing:-.03em}.section p{font-size:19px;line-height:1.75;white-space:pre-line}.take{margin:60px 0;padding:30px;border-radius:22px;background:#dfead9}.take li{margin:12px 0;line-height:1.55}.ref{border-top:1px solid var(--line);padding-top:25px;line-height:1.6}.notice{color:var(--muted);font-size:14px;margin-top:28px}@media(max-width:650px){.hero{padding-top:60px}}</style></head><body><nav><div class="wrap"><a class="brand" href="index.html"><img src="assets/logo.png" alt="MindFit"><span>MINDFIT CIENCIA</span></a><a href="index.html#ciencia">← Volver</a></div></nav><main id="app"><div class="wrap hero"><div class="meta">CARGANDO…</div><h1>MindFit Ciencia</h1></div></main><script>const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const id=new URLSearchParams(location.search).get('id');const contentUrl='content/site.json?v='+Date.now();fetch(contentUrl,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{const a=(data.articles||[]).find(x=>x.slug===id)||(data.articles||[]).find(x=>x.featured)||(data.articles||[])[0];if(!a)throw Error();document.title=a.title+' | MindFit Ciencia';const sections=(a.sections||[]).map(x=>`<section class="section"><h2>${esc(x.heading)}</h2><p>${esc(x.text)}</p></section>`).join('');const points=(a.takeaways||[]).map(x=>`<li>${esc(typeof x==='string'?x:x.item)}</li>`).join('');document.getElementById('app').innerHTML=`<div class="wrap hero"><div class="meta">${esc(a.category)} · ${esc(a.date)} · ${esc(a.read_time)}</div><h1>${esc(a.title)}</h1><p class="subtitle">${esc(a.subtitle)}</p></div><article class="wrap article">${a.intro?`<p class="intro">${esc(a.intro)}</p>`:''}${sections}${points?`<aside class="take"><div class="meta">IDEAS CLAVE</div><h2>Qué nos llevamos</h2><ul>${points}</ul></aside>`:''}<div class="ref"><div class="meta">REFERENCIA</div><p>${esc(a.reference)}</p>${a.source_url?`<p><a href="${esc(a.source_url)}" target="_blank" rel="noopener">Consultar fuente →</a></p>`:''}${a.doi?`<p>DOI: ${esc(a.doi)}</p>`:''}<p class="notice">Contenido divulgativo. No sustituye una valoración individual por un profesional sanitario cuando sea necesaria.</p></div></article>`}).catch(()=>document.getElementById('app').innerHTML='<div class="wrap hero"><h1>No hemos encontrado este artículo.</h1><p><a href="index.html#ciencia">Volver a MindFit Ciencia</a></p></div>');</script></body></html>
